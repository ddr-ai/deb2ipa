name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  debkit-tests-linux:
    name: DebKit unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Run DebKit unit tests
        working-directory: app
        run: swift test
